- title: Batteries
  path: batteries
  icon: mdi:battery-70
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    # The same threshold the weekly digest and sensor.battery_attention_count use,
    # exposed here so the dashboard and the notification cannot disagree about what
    # "low" means. Changing the slider changes both. Note `initial: 40` in
    # battery_monitor.yaml means a restart resets it.
    - type: entities
      title: Threshold
      entities:
      - entity: input_number.battery_warn_level
        name: Warn at or below
      - entity: sensor.battery_attention_count
        name: Needs attention
    - type: custom:battery-state-card
      title: Batteries
      filter:
        include:
        - name: attributes.device_class
          value: battery
        # Both rules, because they catch different things and the card ORs its
        # excludes: `entity.platform` catches anything from the companion app
        # whatever it is called (an Android phone matches none of the words in the
        # regex), the regex catches an Apple device fed in by some other integration.
        #
        # This pair is duplicated in battery_monitor.yaml, which expresses the same
        # two rules as `rejectattr('entity_id','in', integration_entities('mobile_app'))`
        # and the same regex. There is no way to share one definition across a card
        # and a Jinja template, so they are kept in step by hand -- change one, change
        # the other, or the dashboard and the digest disagree about what needs a
        # battery.
        #
        # This used to read `display.platform`, which is not a field the card can
        # resolve -- it silently returned undefined, never matched, and every phone
        # and watch was listed here while the digest excluded them. Resolvable
        # prefixes are entity./device./area./computed., a bare state path, or a
        # real entity domain.
        exclude:
        - name: entity.platform
          value: mobile_app
        - name: entity_id
          value: /iphone|ipad|watch|macbook|phone/
      sort:
        by: state
      # Not `collapse: 5` (an arbitrary count) but a threshold group, so what stays
      # in view is exactly what the digest would name: at or below the warn level,
      # plus anything unavailable -- a non-numeric state fails `>` and so falls out
      # of the OK group. The `{...}` value is read live from the helper.
      collapse:
      - name: OK ({count})
        icon: mdi:battery
        filter:
        - name: state
          operator: '>'
          value: '{input_number.battery_warn_level}'
