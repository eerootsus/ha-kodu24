# Heating shortfall alert - tells Eero when a radiator room stays below its target,
# and what that points at. Alert only: nothing here writes to the boiler or the TRVs.
#
# Rewritten 2026-11-12 for the room thermostat (room_thermostat.yaml): HA opens a
# valve (TRV setpoint 28) whenever its room is under target, so a room that stays
# short has one of four causes, read from the TRV setpoint HA left it on:
#
#   28 (open)      -> the radiator is flat out and still short: the boiler is not
#                     delivering. Raise the curve SHIFT by hand (HEATING_CURVE_TEST.md
#                     "Curve in force"); the slope only for shortfalls that grow with
#                     cold. Valve duty on the Küte view shows the same.
#   5 (shut)       -> HA has shut the valve of a cold room: the room thermostat is
#                     not running, or the room sensor reads wrong.
#   anything else  -> the room is on its own TRV (fallback: its sensor was silent for
#                     20 min) - check the door sensor's battery / Zigbee.
#   thermostat off -> the TRVs regulate themselves on head + trim; raise the trim
#                     (input_number.trv_trim_<room>) or turn the thermostat back on.
#
# The kitchen is NOT alerted while the wind onto its walls is strong (Eero,
# 2026-11-11, CLAUDE.md "Control principle": the SW corner may fall short in high
# wind and the curve is not raised for it). "Onto a wall" is met.no's wind speed x
# cos(angle between where it blows from and the wall's outward direction) - the same
# as heating-check.py; walls S 193 deg and W 283 deg; strong = 6 m/s or more onto
# either. Muted episodes go to the logbook.
#
# The kitchen is also muted while the boiler night setback runs and for 4 h after it
# (boiler_setback.yaml, 2026-11-13): the setback lets the kitchen sag on purpose and
# its radiator recovers slowly. The bedrooms are not muted - they must hold.
#
# The line is each room's own target: input_number.room_target_<room> while the
# thermostat is on, else the TRV's setpoint. Heating weather is met.no < 12 C (not
# the sunlit Vitodens sensor). 3 hours rides out a warm-up after a target is raised;
# one alert per episode (the trigger re-arms once the room is back within 0.5).
#
# A second set of triggers (<room>_nodata) alerts when a room has had no reading for
# 3 h. Without it a dead sensor would read as a room that is fine. If ALL rooms go
# silent at once, suspect room_climate.py (see CLAUDE.md, the 2026-09-13 fix).
#
# Install: declared as `climate_alerts:` in configuration.yaml.

automation:
  - id: heating_shortfall_alert
    alias: "Heating - room below target"
    description: "Alerts when a radiator room stays >0.5 C under its own target for 3 h in heating weather, with the cause read from what the room thermostat is doing. Kitchen muted in strong wind onto its walls and during the boiler night setback (+4 h). Alert only. Source: ha-kodu24/trv-climate/heating_alerts.yaml."
    mode: queued
    triggers:
      - trigger: template
        id: kitchen
        value_template: >
          {% set room = states('sensor.climate_kitchen_temperature') | float(none) %}
          {% set sp = states('input_number.room_target_kitchen') | float(none) if is_state('input_boolean.room_thermostat', 'on') else state_attr('climate.trv_danfoss_kitchen', 'temperature') | float(none) %}
          {{ room is not none and sp is not none
             and state_attr('weather.forecast_kodu', 'temperature') | float(99) < 12
             and sp - room > 0.5 }}
        for: "03:00:00"
      - trigger: template
        id: ada
        value_template: >
          {% set room = states('sensor.climate_ada_s_room_temperature') | float(none) %}
          {% set sp = states('input_number.room_target_ada') | float(none) if is_state('input_boolean.room_thermostat', 'on') else state_attr('climate.trv_sonoff_ada', 'temperature') | float(none) %}
          {{ room is not none and sp is not none
             and state_attr('weather.forecast_kodu', 'temperature') | float(99) < 12
             and sp - room > 0.5 }}
        for: "03:00:00"
      - trigger: template
        id: lola
        value_template: >
          {% set room = states('sensor.climate_lola_s_room_temperature') | float(none) %}
          {% set sp = states('input_number.room_target_lola') | float(none) if is_state('input_boolean.room_thermostat', 'on') else state_attr('climate.trv_sonoff_lola', 'temperature') | float(none) %}
          {{ room is not none and sp is not none
             and state_attr('weather.forecast_kodu', 'temperature') | float(99) < 12
             and sp - room > 0.5 }}
        for: "03:00:00"
      - trigger: template
        id: master
        value_template: >
          {% set room = states('sensor.climate_bedroom_temperature') | float(none) %}
          {% set sp = states('input_number.room_target_master') | float(none) if is_state('input_boolean.room_thermostat', 'on') else state_attr('climate.trv_danfoss_master', 'temperature') | float(none) %}
          {{ room is not none and sp is not none
             and state_attr('weather.forecast_kodu', 'temperature') | float(99) < 12
             and sp - room > 0.5 }}
        for: "03:00:00"
      - trigger: template
        id: stairwell
        value_template: >
          {% set room = states('sensor.climate_trepihall_temperature') | float(none) %}
          {% set sp = states('input_number.room_target_stairwell') | float(none) if is_state('input_boolean.room_thermostat', 'on') else state_attr('climate.trv_danfoss_stairwell', 'temperature') | float(none) %}
          {{ room is not none and sp is not none
             and state_attr('weather.forecast_kodu', 'temperature') | float(99) < 12
             and sp - room > 0.5 }}
        for: "03:00:00"
      # No data: the alert above cannot see a room whose sensors are silent.
      - trigger: template
        id: kitchen_nodata
        value_template: "{{ states('sensor.climate_kitchen_temperature') | float(none) is none }}"
        for: "03:00:00"
      - trigger: template
        id: ada_nodata
        value_template: "{{ states('sensor.climate_ada_s_room_temperature') | float(none) is none }}"
        for: "03:00:00"
      - trigger: template
        id: lola_nodata
        value_template: "{{ states('sensor.climate_lola_s_room_temperature') | float(none) is none }}"
        for: "03:00:00"
      - trigger: template
        id: master_nodata
        value_template: "{{ states('sensor.climate_bedroom_temperature') | float(none) is none }}"
        for: "03:00:00"
      - trigger: template
        id: stairwell_nodata
        value_template: "{{ states('sensor.climate_trepihall_temperature') | float(none) is none }}"
        for: "03:00:00"
    variables:
      key: "{{ trigger.id | replace('_nodata', '') }}"
      rooms: "{{ {'kitchen': ['Köök', 'sensor.climate_kitchen_temperature'], 'ada': ['Ada tuba', 'sensor.climate_ada_s_room_temperature'], 'lola': ['Lola tuba', 'sensor.climate_lola_s_room_temperature'], 'master': ['Kätlyni tuba', 'sensor.climate_bedroom_temperature'], 'stairwell': ['Trepihall', 'sensor.climate_trepihall_temperature']} }}"
      name: "{{ rooms[key][0] }}"
      room: "{{ states(rooms[key][1]) | float(0) }}"
      # Sonoff TRVZBs: Ada since 2026-10-26, Lola since 2026-11-12.
      sonoff: "{{ key in ['ada', 'lola'] }}"
      climate: "{{ ('climate.trv_sonoff_' if sonoff else 'climate.trv_danfoss_') ~ key }}"
      thermostat_on: "{{ is_state('input_boolean.room_thermostat', 'on') }}"
      sp: "{{ states('input_number.room_target_' ~ key) | float(0) if thermostat_on else state_attr(climate, 'temperature') | float(0) }}"
      trv_sp: "{{ state_attr(climate, 'temperature') | float(none) }}"
      trim: "{{ states('input_number.trv_trim_' ~ key) }}"
      # Wind onto the kitchen's outer walls (S 193, W 283 deg), m/s.
      wind_onto: >
        {% set w = state_attr('weather.forecast_kodu', 'wind_speed') | float(0) %}
        {% set u = state_attr('weather.forecast_kodu', 'wind_speed_unit') or 'km/h' %}
        {% set ms = w / 3.6 if 'km' in u else w %}
        {% set b = state_attr('weather.forecast_kodu', 'wind_bearing') | float(0) %}
        {{ [0, ms * cos((b - 193) * pi / 180), ms * cos((b - 283) * pi / 180)] | max | round(1) }}
      setback: >
        {% set b = states.binary_sensor.boiler_setback_active %}
        {{ b is not none and (b.state == 'on' or (now() - b.last_changed).total_seconds() < 4 * 3600) }}
      muted: "{{ key == 'kitchen' and (wind_onto | float(0) >= 6 or setback) }}"
      cause: >
        {% if not thermostat_on %}The room thermostat is off, so the TRV regulates itself on its head + trim (trim {{ trim }}): raise input_number.trv_trim_{{ key }}, or turn input_boolean.room_thermostat back on.
        {% elif trv_sp is not none and trv_sp >= 27 %}HA has its valve open and it is still short: the radiator is flat out, so the boiler is not delivering ({{ states('sensor.vicare_supply_temperature') }} °C supply). Raise the curve shift by hand (now {{ states('number.vitodens_100_heating_curve_shift') }}, slope {{ states('number.vitodens_100_heating_curve_slope') }}); the slope only if rooms fall short in real cold.{{ ' Wind onto the kitchen walls ' ~ wind_onto ~ ' m/s.' if key == 'kitchen' else '' }}
        {% elif trv_sp is not none and trv_sp <= 6 %}HA has its valve SHUT although the room is cold: check that the room thermostat automation is running and that the room sensor reads right.
        {% else %}The room is on its own TRV (setpoint {{ trv_sp }}): the room thermostat fell back because its room sensor went silent. Check the door sensor's battery / Zigbee.{% endif %}
    actions:
      - choose:
          - conditions: "{{ trigger.id.endswith('_nodata') }}"
            sequence:
              - action: notify.mobile_app_eeros_iphone_17
                data:
                  title: "{{ name }}: no room temperature"
                  message: >
                    {{ name }} has had no room reading for 3 h, so the below-target
                    alert cannot see it. Check the room sensors' batteries / Zigbee,
                    or if every room is silent, `ha core logs | grep room_climate`.
                  data:
                    push:
                      thread-id: heating
          - conditions: "{{ muted }}"
            sequence:
              - action: logbook.log
                data:
                  name: "Heating alert"
                  message: >
                    {{ name }} {{ '%.1f' | format(room) }} °C on {{ sp }} for 3 h, not pushed:
                    {{ 'boiler night setback (accepted, kitchen sags on purpose)' if setback else 'wind onto its walls ' ~ wind_onto ~ ' m/s (accepted in strong wind)' }}.
        default:
          - action: notify.mobile_app_eeros_iphone_17
            data:
              title: "{{ name }} {{ '%.1f' | format(room) }} °C, target {{ sp }}"
              message: "Short by {{ '%.1f' | format(sp - room) }} °C for 3 h. {{ cause | trim }}"
              data:
                push:
                  thread-id: heating
