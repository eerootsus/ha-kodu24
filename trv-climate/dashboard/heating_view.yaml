    name: Kõvera nihe
    grid_options:
      columns: 6
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Diagnostika
    icon: mdi:stethoscope
  - type: markdown
    content: "{% set rooms = [\n  ('Köök', 'kitchen', 'sensor.climate_kitchen_temperature', 'kitchen'),\n\
      \  ('Ada', 'ada', 'sensor.climate_ada_s_room_temperature', 'ada_s_room'),\n  ('Lola', 'lola', 'sensor.climate_lola_s_room_temperature',\
      \ 'lola_s_room'),\n  ('Kätlyn', 'master', 'sensor.climate_bedroom_temperature', 'bedroom'),\n  ('Trepihall',\
      \ 'stairwell', 'sensor.climate_trepihall_temperature', 'trepihall')] %}\n{% set wlabels = labels()\
      \ | select('match', 'sensor_weight_') | list %}\n{% macro n(v, f='%.1f') %}{{ (f | format(v)) |\
      \ replace('-', '−') if v is not none else '–' }}{% endmacro %}\n{% macro grey(t) %}<font color=\"\
      gray\">{{ t }}</font>{% endmacro %}\n{% macro gap(d) %}{% if d is none %}–{% else %}<font color=\"\
      {{ 'dodgerblue' if d < -0.5 else ('darkorange' if d > 0.5 else 'mediumseagreen') }}\"><b>{{ ('%+.1f'\
      \ | format(d)) | replace('-', '−') }}</b></font>{% endif %}{% endmacro %}\n| Ruum | Tuba | Andur\
      \ | Alt | TRV | Siht | Tuba−siht | TRV−tuba | Trimm | Klapp |\n|:--|--:|--:|--:|--:|--:|--:|--:|--:|--:|\n\
      {%- for name, s, r, area in rooms %}\n{#- Ada and Lola are Sonoff TRVZBs: no valve %, its trim\
      \ is minus its local offset. #}\n{%- set c = 'climate.trv_sonoff_' ~ s if s in ['ada', 'lola'] else 'climate.trv_danfoss_'\
      \ ~ s %}\n{%- set room = (states(r) | float(none)) if r else none %}\n{%- set trv = state_attr(c,\
      \ 'current_temperature') | float(none) %}\n{%- set v = state_attr(c, 'temperature') | float(none) %}\n{%- set sp = states('input_number.room_target_' ~ s) | float(none) if is_state('input_boolean.room_thermostat', 'on') else v\
      \ %}\n{%- set settled = states('sensor.trv_offset_' ~ s ~ '_settled') | float(none) %}\n{%- set\
      \ raw = (trv - (states('number.trv_sonoff_' ~ s ~ '_local_temperature_offset')\
      \ | float(0) if s in ['ada', 'lola'] else 0) - room) if (trv is not none and room is not none) else none %}\n{#- The room's weighted\
      \ sensors: a name containing \"Alt\" goes to the Alt column. #}\n{%- set ns = namespace(main=none,\
      \ alt=none) %}\n{%- for l in wlabels %}{% for d in label_devices(l) if area_id(d) == area %}\n{%-\
      \ set t = namespace(v=none) %}\n{%- for e in device_entities(d) if is_state_attr(e, 'device_class',\
      \ 'temperature') and t.v is none %}{% set t.v = states(e) | float(none) %}{% endfor %}\n{%- if 'Alt'\
      \ in (device_attr(d, 'name_by_user') or device_attr(d, 'name') or '') %}{% set ns.alt = t.v %}{%\
      \ else %}{% set ns.main = t.v %}{% endif %}\n{%- endfor %}{% endfor %}\n| **{{ name }}**{{ ' ⇄'\
      \ if states('number.trv_danfoss_' ~ s ~ '_external_temperature_sensor') | float(-80) > -80 else\
      \ '' }} | **{{ n(room) }}** | {{ grey(n(ns.main)) if ns.main is not none else '' }} | {{ grey(n(ns.alt))\
      \ if ns.alt is not none else '' }} | {{ n(trv) }} | {{ n(sp) }} | {{ gap((room - sp) if (room is\
      \ not none and sp is not none) else none) }} | {{ n(settled, '%+.1f') if settled is not none else\
      \ ('~' ~ n(raw, '%+.1f') if raw is not none else '–') }} | {{ n(-(states('number.trv_sonoff_' ~ s ~ '_local_temperature_offset')\
      \ | float(0)) if s in ['ada', 'lola'] else states('number.trv_danfoss_' ~ s ~ '_regulation_setpoint_offset')\
      \ | float(none), '%+.1f') }} | {{ ('küte' if is_state_attr(c, 'hvac_action', 'heating') else 'kinni')\
      \ if s in ['ada', 'lola'] else states('sensor.trv_danfoss_' ~ s ~ '_pi_heating_demand') ~ ' %' }}{{ (' · HA ' ~ ('avatud' if v >= 27 else 'kinni' if v <= 6 else 'TRV ise')) if is_state('input_boolean.room_thermostat', 'on') and v is not none else '' }} |\n{%- endfor\
      \ %}\n\n**Tuba** = ukse juures olev andur (Andur); Alt on välisseina ääres ja ei lähe arvesse.\n\
      **TRV−tuba** = TRV-anduri viga (~ = hetkeväärtus, muidu settled). Trimm peaks sellega\nühtima, et\
      \ tuba jõuaks sihini. **⇄** = TRV-le saadetakse toa temperatuuri (automaatne nihe, trimm 0). Võrdlus\
      \ nädalate kaupa: `./heating-check.py`.\n**Siht** = HA toa siht, kui HA termostaat on sees (TRV seatakse siis 28 = avatud / 5 = kinni); muidu TRV enda siht."
    grid_options:
      columns: full
# Beside Diagnostika: the heating pressure, the slow-leak watch (heating-pressure/,
# PLANS.md Background "Heating system pressure").
- type: grid
  cards:
  - type: heading
    heading: Rõhk
    icon: mdi:gauge
  # The slow-leak watch: at a steady supply temperature the daily mean should hold
  # ~1.9-2.0 bar; a step down by mid-December means the leak is still there (PLANS.md).
  - type: statistics-graph
    title: Päeva keskmine, 30 p
    chart_type: line
    period: day
    days_to_show: 30
    stat_types:
    - mean
    entities:
    - entity: sensor.vitodens_100_supply_pressure
      name: Rõhk
    min_y_axis: 1.5
    max_y_axis: 2.5
    grid_options:
      columns: 12
      rows: 7
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Gaasikatel
    icon: mdi:water-boiler
  - type: tile
    entity: sensor.vicare_outside_temperature
    name: Õues (katla andur)
    grid_options:
      columns: 6
  - type: tile
    entity: weather.forecast_kodu
    name: Õues (met.no)
    state_content:
    - temperature
    - state
    grid_options:
      columns: 6
  - type: tile
    entity: sensor.vicare_supply_temperature
    name: Pealevool
    grid_options:
      columns: 6
  - type: tile
    entity: binary_sensor.vicare_burner_active
    name: Põleti
    grid_options:
      columns: 6
  - type: tile
    entity: sensor.vicare_heating_gas_consumption_current_day
    name: Gaas täna
    grid_options:
      columns: 6
  - type: tile
    entity: sensor.vicare_heating_gas_consumption_last_seven_days
    name: Gaas 7 päeva
    grid_options:
      columns: 6
  - type: tile
    entity: climate.vicare_heating
    name: Režiim
    grid_options:
      columns: 6
  - type: tile
    entity: water_heater.vicare_water
    name: Tarbevesi
    grid_options:
      columns: 6
  # Fills the boiler section beside the gas graph: the curve at work - supply against
  # outside, and the room setting the night setback lowers (boiler_setback.yaml).
  - type: history-graph
    title: Pealevool, õues ja katla toa seade, 48 h
    hours_to_show: 48
    entities:
    - entity: sensor.vicare_supply_temperature
      name: Pealevool
    - entity: sensor.vicare_outside_temperature
      name: Õues
    - entity: number.vitodens_100_normal_temperature
      name: Katla toa seade
    grid_options:
      columns: full
      rows: 4
- type: grid
  cards:
  - type: heading
    heading: Küttegaas
    icon: mdi:fire
  - type: statistics-graph
    title: Küttegaas päevas
    chart_type: bar
    period: day
    days_to_show: 30
    stat_types:
    - change
    entities:
    - entity: sensor.vicare_heating_gas_consumption_current_day
      name: Gaas
    grid_options:
      columns: full
      rows: 6
- type: grid
  column_span: 3
  cards:
  - type: heading
    heading: Trendid
    icon: mdi:chart-line
  - type: history-graph
    title: Toatemperatuurid, 48 h
    hours_to_show: 48
    entities:
    - entity: sensor.climate_kitchen_temperature
      name: Köök
    - entity: sensor.climate_ada_s_room_temperature
      name: Ada tuba
    - entity: sensor.climate_lola_s_room_temperature
      name: Lola tuba
    - entity: sensor.climate_bedroom_temperature
      name: Kätlyni tuba
    - entity: sensor.ikea_of_sweden_vindstyrka_temperature
      name: Töökoda
    grid_options:
      columns: 12
      rows: 6
  - type: statistics-graph
    title: Klapp avatud, % tunnist (7 p)
    chart_type: line
    min_y_axis: 0
    max_y_axis: 100
    period: hour
    days_to_show: 7
    stat_types:
    - mean
    entities:
    - entity: sensor.valve_open_kitchen
      name: Köök
    - entity: sensor.valve_open_ada
      name: Ada tuba
    - entity: sensor.valve_open_lola
      name: Lola tuba
    - entity: sensor.valve_open_master
      name: Kätlyni tuba
    - entity: sensor.valve_open_stairwell
      name: Trepihall
    grid_options:
      columns: 12
      rows: 6
  - type: statistics-graph
    title: Tuba − siht, K (7 p)
    chart_type: line
    min_y_axis: -1
    max_y_axis: 1
    period: hour
    days_to_show: 7
    stat_types:
    - mean
    entities:
    - entity: sensor.room_error_kitchen
      name: Köök
    - entity: sensor.room_error_ada
      name: Ada tuba
    - entity: sensor.room_error_lola
      name: Lola tuba
    - entity: sensor.room_error_master
      name: Kätlyni tuba
    - entity: sensor.room_error_stairwell
      name: Trepihall
    grid_options:
      columns: 12
      rows: 6
  - type: markdown
    content: 'Klapp ~100 % ja tuba sihist all = katlast ei tule piisavalt (kõver). Muidu näitab
      klapi osakaal, kui palju sihi hoidmine maksab (tuul). Toad on meelega ~0,1 K sihist all.
      Sama tabelina: `./heating-check.py --duty`.'
    grid_options:
      columns: full
