# Heating shortfall alert - tells Eero when a TRV room stays below its target,
# and which knob it points at. Alert only: nothing here writes to the boiler or
# the TRVs. The curve and the trims are adjusted by hand.
#
# Why alert-only instead of curve-test/ (which raises the slope by itself): the
# trims went in on 2026-10-17 and every room is now meant to land on its own
# target (22 on the dial = ~22 in the room). A shortfall can then have three
# different causes, and only one of them is the curve - see the Diagnostika table
# on the Küte dashboard, which this mirrors:
#
#   valve >= 80 %  -> the TRV is calling flat out and the room is still short:
#                     the radiator cannot deliver at this supply temperature.
#                     Raise the heating curve - the SHIFT (+1) for mild-weather
#                     shortfalls, the slope only for real-cold ones (a slope step
#                     adds ~1 C at +12 outside but ~4 C at -20; a shift step adds
#                     the same everywhere). Goal: stay below previous years' 1.2.
#   valve 2-79 %   -> the TRV believes it has reached target + trim: its own
#                     (radiator-warmed) sensor error outgrew the trim. Raise the
#                     trim, or it is at +2.5 and the TRV needs another approach.
#   valve <= 1 %   -> not calling at all: stuck valve or a mesh fault.
#
# Each room's own TRV target is the line, not a fixed number, so a room set to 20
# is judged against 20. Heating weather is met.no (not the sunlit Vitodens
# sensor, see HEATING_CURVE_TEST.md). 3 hours is long enough to ride out the
# warm-up after someone raises a target; one alert per episode (the trigger only
# re-arms once the room is back within 0.5).
#
# A second set of triggers (<room>_nodata) alerts when a room has had no reading
# for 3 h. Without it a dead sensor would read as a room that is fine: the
# shortfall template cannot evaluate, so it simply never fires. If ALL rooms go
# silent at once, suspect danfoss.py (see CLAUDE.md, the 2026-09-13 fix).
#
# Install: declared as `climate_alerts:` in configuration.yaml.

automation:
  - id: heating_shortfall_alert
    alias: "Heating - room below target"
    description: "Alerts when a TRV room stays >0.5 C under its own target for 3 h in heating weather. Alert only. Source: ha-kodu24/trv-climate/heating_alerts.yaml."
    mode: queued
    triggers:
      - trigger: template
        id: kitchen
        value_template: >
          {% set room = states('sensor.climate_kitchen_temperature') | float(none) %}
          {% set sp = state_attr('climate.trv_danfoss_kitchen', 'temperature') | float(none) %}
          {{ room is not none and sp is not none
             and state_attr('weather.forecast_kodu', 'temperature') | float(99) < 12
             and sp - room > 0.5 }}
        for: "03:00:00"
      - trigger: template
        id: ada
        value_template: >
          {% set room = states('sensor.climate_ada_s_room_temperature') | float(none) %}
          {% set sp = state_attr('climate.trv_danfoss_ada', 'temperature') | float(none) %}
          {{ room is not none and sp is not none
             and state_attr('weather.forecast_kodu', 'temperature') | float(99) < 12
             and sp - room > 0.5 }}
        for: "03:00:00"
      - trigger: template
        id: lola
        value_template: >
          {% set room = states('sensor.climate_lola_s_room_temperature') | float(none) %}
          {% set sp = state_attr('climate.trv_danfoss_lola', 'temperature') | float(none) %}
          {{ room is not none and sp is not none
             and state_attr('weather.forecast_kodu', 'temperature') | float(99) < 12
             and sp - room > 0.5 }}
        for: "03:00:00"
      - trigger: template
        id: master
        value_template: >
          {% set room = states('sensor.climate_bedroom_temperature') | float(none) %}
          {% set sp = state_attr('climate.trv_danfoss_master', 'temperature') | float(none) %}
          {{ room is not none and sp is not none
             and state_attr('weather.forecast_kodu', 'temperature') | float(99) < 12
             and sp - room > 0.5 }}
        for: "03:00:00"
      # No data: the alert above cannot see a room whose sensors are silent.
      - trigger: template
        id: kitchen_nodata
        value_template: "{{ states('sensor.climate_kitchen_temperature') | float(none) is none }}"
        for: "03:00:00"
      - trigger: template
        id: ada_nodata
        value_template: "{{ states('sensor.climate_ada_s_room_temperature') | float(none) is none }}"
        for: "03:00:00"
      - trigger: template
        id: lola_nodata
        value_template: "{{ states('sensor.climate_lola_s_room_temperature') | float(none) is none }}"
        for: "03:00:00"
      - trigger: template
        id: master_nodata
        value_template: "{{ states('sensor.climate_bedroom_temperature') | float(none) is none }}"
        for: "03:00:00"
    variables:
      key: "{{ trigger.id | replace('_nodata', '') }}"
      rooms: "{{ {'kitchen': ['Köök', 'sensor.climate_kitchen_temperature'], 'ada': ['Ada tuba', 'sensor.climate_ada_s_room_temperature'], 'lola': ['Lola tuba', 'sensor.climate_lola_s_room_temperature'], 'master': ['Kätlyni tuba', 'sensor.climate_bedroom_temperature']} }}"
      name: "{{ rooms[key][0] }}"
      room: "{{ states(rooms[key][1]) | float(0) }}"
      sp: "{{ state_attr('climate.trv_danfoss_' ~ key, 'temperature') | float(0) }}"
      trv: "{{ state_attr('climate.trv_danfoss_' ~ key, 'current_temperature') }}"
      trim: "{{ states('number.trv_danfoss_' ~ key ~ '_regulation_setpoint_offset') | float(0) }}"
      valve: "{{ states('sensor.trv_danfoss_' ~ key ~ '_pi_heating_demand') | float(-1) }}"
      # Room fed to the TRV (room_feed.yaml, automatic offset mode): the trim is 0 on
      # purpose there, so "raise the trim" would be wrong advice.
      fed: "{{ states('number.trv_danfoss_' ~ key ~ '_external_temperature_sensor') | float(-80) > -80 }}"
      cause: >
        {% if valve >= 80 %}Valve {{ valve | int }} % open and still short: the radiator cannot deliver at {{ states('sensor.vicare_supply_temperature') }} °C supply. Raise the heating curve: shift +1 (now {{ states('number.vitodens_100_heating_curve_shift') }}, slope {{ states('number.vitodens_100_heating_curve_slope') }}). Use the shift for mild-weather shortfalls; the slope only if rooms fall short in real cold.
        {% elif valve > 1 and fed %}Valve only {{ valve | int }} % open although the TRV is fed the room temperature (automatic offset): check that room_feed.yaml is still writing (last value {{ states('number.trv_danfoss_' ~ key ~ '_external_temperature_sensor') }} °C), then give the TRV's self-correction time - or go back to a fixed trim.
        {% elif valve > 1 %}Valve only {{ valve | int }} % open: the TRV is throttling, reading {{ trv }} °C against target + trim {{ sp + trim }}. Its sensor error outgrew the trim{{ ' - and the trim is already at the +2.5 maximum' if trim >= 2.5 else '; raise the trim' }}.
        {% elif valve >= 0 %}Valve not calling ({{ valve | int }} %) while the room is cold: stuck valve or mesh fault.
        {% else %}Valve demand unavailable: check the TRV.{% endif %}
    actions:
      - choose:
          - conditions: "{{ trigger.id.endswith('_nodata') }}"
            sequence:
              - action: notify.mobile_app_eeros_iphone_17
                data:
                  title: "{{ name }}: no room temperature"
                  message: >
                    {{ name }} has had no room reading for 3 h, so the below-target
                    alert cannot see it. Check the room sensors' batteries / Zigbee,
                    or if every room is silent, `ha core logs | grep danfoss`.
                  data:
                    push:
                      thread-id: heating
        default:
          - action: notify.mobile_app_eeros_iphone_17
            data:
              title: "{{ name }} {{ '%.1f' | format(room) }} °C, target {{ sp }}"
              message: "Short by {{ '%.1f' | format(sp - room) }} °C for 3 h. {{ cause | trim }}"
              data:
                push:
                  thread-id: heating
