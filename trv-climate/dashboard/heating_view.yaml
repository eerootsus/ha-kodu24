- type: grid
  cards:
  - type: heading
    heading: Juhtimine
    icon: mdi:tune-variant
  - type: tile
    entity: input_boolean.room_thermostat
    name: HA termostaat
    grid_options:
      columns: 12
  # Night setback (trv-climate/boiler_setback.yaml): tap toggles the switch; the icon
  # lights while the setback window is running; the tile beside it is what the boiler
  # actually holds.
  - type: custom:mushroom-template-card
    entity: input_boolean.boiler_setback
    primary: Öine langetus
    secondary: >-
      {% if is_state('input_boolean.boiler_setback', 'on') %}{{ states('input_datetime.boiler_setback_start')[:5] }}–{{ states('input_datetime.boiler_setback_end')[:5] }}, {{ states('input_number.boiler_room_night') | int }} / {{ states('input_number.boiler_room_day') | int }} °C{{ ' · käib' if is_state('binary_sensor.boiler_setback_active', 'on') else '' }}{% else %}väljas{% endif %}
    icon: mdi:weather-night
    icon_color: >-
      {{ 'indigo' if is_state('binary_sensor.boiler_setback_active', 'on') else ('grey' if is_state('input_boolean.boiler_setback', 'on') else 'disabled') }}
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    grid_options:
      columns: 6
  - type: tile
    entity: number.vitodens_100_normal_temperature
    name: Katla toa seade
    grid_options:
      columns: 6
  - type: tile
