# Backup monitor dashboard cards — copy-paste into the network dashboard.
#
# Same convention as chores/dashboard/: dashboards do not auto-discover YAML
# from directories, so these are templates you paste into a card's YAML editor,
# not something HA loads on its own.
#
# Requires backup_monitor.yaml to be loaded first (these reference its
# template entities).

# ---------------------------------------------------------------------------
# 1. Uptime strips — custom:uptime-card (HACS), the same card the Network view
#    already uses for internet access, so backups read the same way as
#    everything else there.
#
#    Polarity note: uptime-card treats `on` as OK, which is why the template
#    binary_sensors are healthy=on rather than device_class problem — the
#    latter would invert every strip.
# ---------------------------------------------------------------------------
type: custom:uptime-card
title_template: Media mirror
entity: binary_sensor.backup_media_healthy
hours_to_show: 168
icon: mdi:filmstrip
severity: 10
update_interval: 300
title_adaptive_color: false
status_adaptive_color: true
icon_adaptive_color: false
tooltip_adaptive_color: true
alias:
  ok: Backed up
  ko: Failing

---

type: custom:uptime-card
title_template: Borg (precious)
entity: binary_sensor.backup_borg_healthy
hours_to_show: 168
icon: mdi:shield-lock
severity: 10
update_interval: 300
title_adaptive_color: false
status_adaptive_color: true
icon_adaptive_color: false
tooltip_adaptive_color: true
alias:
  ok: Backed up
  ko: Failing

---

type: custom:uptime-card
title_template: Unraid flash
entity: binary_sensor.backup_flash_healthy
hours_to_show: 168
icon: mdi:usb-flash-drive
severity: 10
update_interval: 300
title_adaptive_color: false
status_adaptive_color: true
icon_adaptive_color: false
tooltip_adaptive_color: true
alias:
  ok: Backed up
  ko: Failing

---

# The only local job of the four: ZFS pool -> parity array, run on the Unraid
# host rather than the VM. Same strip treatment so it reads identically.
type: custom:uptime-card
title_template: Pool to array
entity: binary_sensor.backup_pool_healthy
hours_to_show: 168
icon: mdi:database-arrow-right
severity: 10
update_interval: 300
title_adaptive_color: false
status_adaptive_color: true
icon_adaptive_color: false
tooltip_adaptive_color: true
alias:
  ok: Backed up
  ko: Failing

---

# ---------------------------------------------------------------------------
# 2. Current state — what the strip cannot tell you: when each last succeeded,
#    and what the last report actually said.
# ---------------------------------------------------------------------------
type: entities
title: Backups
entities:
  - type: section
    label: Last successful run
  - entity: input_datetime.backup_media_last_ok
    name: Media mirror
  - entity: input_datetime.backup_borg_last_ok
    name: Borg (precious)
  - entity: input_datetime.backup_flash_last_ok
    name: Unraid flash
  - entity: input_datetime.backup_pool_last_ok
    name: Pool to array
  - type: section
    label: Last reported status
  - entity: input_text.backup_media_status
    name: Media mirror
  - entity: input_text.backup_borg_status
    name: Borg (precious)
  - entity: input_text.backup_flash_status
    name: Unraid flash
  - entity: input_text.backup_pool_status
    name: Pool to array
  - type: section
    label: Off-site capacity
  - entity: sensor.hetzner_box_used
    name: Box used
  - entity: input_number.hetzner_box_used_percent
    name: Box used (%)
  - entity: input_datetime.hetzner_capacity_last_seen
    name: Capacity checked

---

# ---------------------------------------------------------------------------
# 3. Backup size over time — the upgrade decision. statistics-graph (not
#    history-graph) because it reads HA's long-term statistics and so keeps
#    working over months, which is the timescale that matters here.
#
#    Plotted in TB against the 5 TB ceiling; borg is the fast-growing part
#    (~240 GB/month deduplicated) while the media mirror moves in steps as
#    rips land. Watching them separately tells you which one is eating the box.
# ---------------------------------------------------------------------------
type: statistics-graph
title: Off-site backup size
period: day
days_to_show: 90
stat_types:
  - max
chart_type: line
entities:
  - entity: sensor.hetzner_box_used
    name: Box total (TB)
  - entity: sensor.hetzner_media_mirror
    name: Media mirror (TB)

---

# ---------------------------------------------------------------------------
# 4. Borg growth on its own axis — 315 GB next to a 4 TB line is invisible,
#    and borg's slope is the one that decides when BX31 is needed.
# ---------------------------------------------------------------------------
type: statistics-graph
title: Borg repo growth
period: day
days_to_show: 90
stat_types:
  - max
chart_type: line
entities:
  - entity: sensor.hetzner_borg_repo
    name: Borg repo (GB)

---

# ---------------------------------------------------------------------------
# 5. Optional: fill percentage with the alert thresholds visible as a gauge.
#    85 = plan the BX31 upgrade, 92 = do it now.
# ---------------------------------------------------------------------------
type: gauge
entity: input_number.hetzner_box_used_percent
name: Hetzner box
unit: "%"
min: 0
max: 100
severity:
  green: 0
  yellow: 85
  red: 92

---

# ---------------------------------------------------------------------------
# 6. VM disk — the machine everything actually runs on. Gauge severity is set
#    at the alert thresholds (80 plan / 90 act), which are low on purpose:
#    Jellyfin needs 2 GiB free to start, and on a 94 GB disk that is ~98%, so
#    by the time "nearly full" looks alarming a service has already refused
#    to boot. That is exactly what happened on 2026-08-15.
# ---------------------------------------------------------------------------
type: gauge
entity: input_number.vm_disk_used_percent
name: VM disk
unit: "%"
min: 0
max: 100
severity:
  green: 0
  yellow: 80
  red: 90

---

# ---------------------------------------------------------------------------
# 7. VM disk trend + the weekly image-update count, together: the first says
#    whether the disk is filling, the second is the usual reason it does
#    (image pulls and build layers).
# ---------------------------------------------------------------------------
type: entities
title: VM host
entities:
  - entity: input_number.vm_disk_free_gb
    name: Disk free
  - entity: input_number.vm_disk_used_percent
    name: Disk used
  - entity: input_datetime.vm_disk_last_seen
    name: Disk checked
  - type: section
    label: Container images
  - entity: input_number.container_updates_count
    name: Updates available

---

# ---------------------------------------------------------------------------
# 8. Disk fill over time. history-graph rather than statistics-graph: this is
#    a plain input_number with no state_class, so it has no long-term
#    statistics — 30 days of recorder history is what is available, and is
#    enough to see a trend before it becomes an outage.
# ---------------------------------------------------------------------------
type: history-graph
title: VM disk used (%)
hours_to_show: 720
entities:
  - entity: input_number.vm_disk_used_percent
    name: Root filesystem

---

# ---------------------------------------------------------------------------
# 9. Unraid array — the storage everything irreplaceable actually lives on.
#    Gauge is inverted relative to the others: it shows FREE GB, because that
#    is the number that decides whether the next download fits. Severity bands
#    are the alert thresholds (400 plan / 150 act), so green shrinks as the
#    array fills rather than the reverse.
# ---------------------------------------------------------------------------
type: entities
title: Unraid array
entities:
  - entity: input_number.array_free_gb
    name: Free space
  - entity: input_number.array_used_percent
    name: Used
  - entity: input_datetime.array_last_seen
    name: Checked

---

type: history-graph
title: Array free space (GB)
hours_to_show: 720
entities:
  - entity: input_number.array_free_gb
    name: Free
