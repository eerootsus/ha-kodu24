# Backup monitor — alerts for the backup jobs protecting the server.
#
# Three run on the VM (alpine-docker) and are off-site: media, borg, flash.
# One runs on the Unraid host and is local: `pool` (ZFS pool -> parity array,
# added 2026-09-05) — it is host-side because the consistent snapshot needs
# zfs, and because the VM's own vdisk is part of what it backs up, so a
# VM-side cron would be circular. Both report through the same webhook.
#
# Not climate-related, but it lives here for the same reason battery-monitor
# does: this is the de facto HA config repo. The backup jobs themselves and
# their rationale are documented in the `unraid` repo (notes/offsite-backup.md).
#
# Why the alerting lives in HA at all: the natural build — a watchdog beside the
# backups, mailing on failure — routes the alarm through `mailserver`, a
# container on the very VM being watched, so a VM failure takes the alarm down
# with it. Even Uptime Kuma on the Linode only moves the *check*, not the
# notification. HA is a separate machine and the companion app pushes over
# Apple/Google infrastructure, so no part of the delivery path is ours.
# Residual shared fate: HA is at the same site, so a power/ISP outage silences
# it — acceptable, since the backups aren't running then either.
#
# The VM reports via webhook rather than the REST API. The webhook id
# authorises exactly one automation, whereas a long-lived token on an
# internet-facing VM would grant full control of the house.
#
# /root/bin/notify-ha.sh on the VM (and the equivalent notify() inside
# /boot/config/scripts/pool-backup.sh on the host) reports three states:
#   ok      — run finished cleanly
#   fail    — run broke; alert immediately, with detail
#   running — a previous run is still going. The media sync's pidfile guard
#             no-ops during a multi-day transfer (the initial seed took four
#             days), so without this a perfectly healthy long sync would page
#             every night — and false alarms are how you learn to swipe away
#             the real one.
#
# Install: copy to config/backup-monitor/ and add under homeassistant: packages:
#   backup_monitor: !include backup-monitor/backup_monitor.yaml

input_text:
  # Current state per job, so a failure is visible in HA rather than existing
  # only as a push that has already gone. A failing job keeps refreshing
  # last_seen (it is alive, it is just broken), so without this the only
  # trace of a failure between nightly runs is a notification you may have
  # dismissed.
  backup_media_status:
    name: Backup media status
    max: 20
  backup_borg_status:
    name: Backup borg status
    max: 20
  backup_flash_status:
    name: Backup flash status
    max: 20
  # pool -> array nightly (device-failure layer for the ZFS pool). Unlike the
  # three above it runs on the Unraid *host*, not the VM: the consistent
  # snapshot needs zfs, and the VM's own vdisk is part of what it copies.
  backup_pool_status:
    name: Backup pool status
    max: 20

  # zpool health, not a backup at all -- it rides this machinery because the
  # dead-man switch below is exactly what a health check wants, and the
  # templated `backup_<job>_*` entity names are what make that generic. The
  # `backup_` prefix is a naming artifact; read it as "monitored job zpool".
  # Reported daily by /boot/config/scripts/zpool-check.sh on the host.
  backup_zpool_status:
    name: Backup zpool status
    max: 120

input_number:
  # Recorded rather than merely alerted on, because capacity is a slope, not a
  # state: HA long-term statistics make "when does this box need upgrading"
  # directly plottable. BX21 is 5 TB; the upgrade to BX31 (10 TB) is in-place
  # with data preserved, so lead time is all that's needed.
  hetzner_box_used_percent:
    name: Hetzner box used
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    mode: box
  # Absolute sizes as well as the percentage: "80%" does not graph as backup
  # size, and after a BX31 upgrade the percentage would drop by half while the
  # data kept growing — the TB line stays continuous across that.
  hetzner_box_used_tb:
    name: Hetzner box used TB
    min: 0
    max: 50
    step: 0.001
    unit_of_measurement: TB
    mode: box
  hetzner_borg_repo_gb:
    name: Hetzner borg repo GB
    min: 0
    max: 50000
    step: 0.01
    unit_of_measurement: GB
    mode: box
  # The VM's own root disk. Added 2026-08-15 after Jellyfin crash-looped for
  # hours at 96% full — it has a hard 2 GiB free-space precondition and simply
  # refuses to start below it, so the failure was total rather than gradual and
  # nothing announced it. The off-site box had three layers of monitoring while
  # the disk every service actually runs on had none.
  vm_disk_used_percent:
    name: VM disk used
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    mode: box
  vm_disk_free_gb:
    name: VM disk free GB
    min: 0
    max: 1000
    step: 0.1
    unit_of_measurement: GB
    mode: box
  # The Unraid array. Alerts key off FREE SPACE, not percent: one UHD remux is
  # 30-80 GB, so "90% full" on a 4.5 TB array is a different statement from 90%
  # on a 100 GB disk. What matters is whether the next film still fits.
  array_free_gb:
    name: Array free GB
    min: 0
    max: 20000
    step: 0.1
    unit_of_measurement: GB
    mode: box
  array_used_percent:
    name: Array used
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    mode: box
  container_updates_count:
    name: Container updates available
    min: 0
    max: 100
    step: 1
    mode: box

input_datetime:
  # Capacity check has its own heartbeat, so a monitor that quietly stops
  # reporting doesn't leave a reassuring stale number on the dashboard.
  hetzner_capacity_last_seen:
    name: Hetzner capacity last seen
    has_date: true
    has_time: true
  vm_disk_last_seen:
    name: VM disk last seen
    has_date: true
    has_time: true
  array_last_seen:
    name: Array capacity last seen
    has_date: true
    has_time: true
  backup_media_last_seen:
    name: Backup media last seen
    has_date: true
    has_time: true
  backup_media_last_ok:
    name: Backup media last ok
    has_date: true
    has_time: true
  backup_borg_last_seen:
    name: Backup borg last seen
    has_date: true
    has_time: true
  backup_borg_last_ok:
    name: Backup borg last ok
    has_date: true
    has_time: true
  backup_flash_last_seen:
    name: Backup flash last seen
    has_date: true
    has_time: true
  backup_flash_last_ok:
    name: Backup flash last ok
    has_date: true
    has_time: true
  backup_pool_last_seen:
    name: Backup pool last seen
    has_date: true
    has_time: true
  backup_pool_last_ok:
    name: Backup pool last ok
    has_date: true
    has_time: true

  backup_zpool_last_seen:
    name: Backup zpool last seen
    has_date: true
    has_time: true
  backup_zpool_last_ok:
    name: Backup zpool last ok
    has_date: true
    has_time: true

# ---------------------------------------------------------------------------
# Template entities exist for the dashboard, and for one property input_* lack:
# long-term statistics. HA keeps statistics for sensors carrying a state_class,
# so these are what make a months-long fill curve plottable — the input_numbers
# are only storage the webhook can write to.
# ---------------------------------------------------------------------------
template:
  - sensor:
      - name: Hetzner box used
        unique_id: hetzner_box_used_size
        state: "{{ states('input_number.hetzner_box_used_tb') | float(0) }}"
        unit_of_measurement: TB
        device_class: data_size
        state_class: measurement

      - name: Hetzner borg repo
        unique_id: hetzner_borg_repo_size
        state: "{{ states('input_number.hetzner_borg_repo_gb') | float(0) }}"
        unit_of_measurement: GB
        device_class: data_size
        state_class: measurement

      # Derived rather than measured: walking the media mirror with du means
      # 100k+ files over SSH, and (box used - borg repo) is exact anyway.
      - name: Hetzner media mirror
        unique_id: hetzner_media_mirror_size
        state: >
          {{ ((states('input_number.hetzner_box_used_tb') | float(0))
              - (states('input_number.hetzner_borg_repo_gb') | float(0) / 1024)) | round(3) }}
        unit_of_measurement: TB
        device_class: data_size
        state_class: measurement

  - binary_sensor:
      # Uptime strips for the custom:uptime-card already used on the Network
      # dashboard. Polarity matters: that card treats `on` as OK by default
      # (matching the internet-access card), so these are healthy=on. Using
      # device_class problem instead would invert every strip.
      # "Healthy" deliberately means both status ok AND a success within 26 h,
      # so a job frozen on a stale ok cannot show green forever.
      - name: Backup media healthy
        unique_id: backup_media_healthy
        state: >
          {{ (states('input_text.backup_media_status') == 'ok'
                  and (now().timestamp()
                       - (state_attr('input_datetime.backup_media_last_ok', 'timestamp') | float(0))) < 93600) }}

      - name: Backup borg healthy
        unique_id: backup_borg_healthy
        state: >
          {{ (states('input_text.backup_borg_status') == 'ok'
                  and (now().timestamp()
                       - (state_attr('input_datetime.backup_borg_last_ok', 'timestamp') | float(0))) < 93600) }}

      - name: Backup flash healthy
        unique_id: backup_flash_healthy
        state: >
          {{ (states('input_text.backup_flash_status') == 'ok'
                  and (now().timestamp()
                       - (state_attr('input_datetime.backup_flash_last_ok', 'timestamp') | float(0))) < 93600) }}

      - name: Backup pool healthy
        unique_id: backup_pool_healthy
        state: >
          {{ (states('input_text.backup_pool_status') == 'ok'
                  and (now().timestamp()
                       - (state_attr('input_datetime.backup_pool_last_ok', 'timestamp') | float(0))) < 93600) }}

      # 26 h like the others: zpool-check runs daily at 06:00, so two missed
      # runs is the signal. A DEGRADED mirror reports `fail` immediately and
      # trips this the same way a failed backup does.
      - name: Backup zpool healthy
        unique_id: backup_zpool_healthy
        state: >
          {{ (states('input_text.backup_zpool_status') == 'ok'
                  and (now().timestamp()
                       - (state_attr('input_datetime.backup_zpool_last_ok', 'timestamp') | float(0))) < 93600) }}

automation:
  - id: backup_job_report
    alias: Backup - report from alpine-docker
    description: >
      Receives every backup run's outcome from the VM. Any report at all
      refreshes last_seen; only a clean run refreshes last_ok. Those are
      deliberately separate, because "nothing ran" and "runs but never
      finishes" are different failures and want different messages.
    mode: queued
    max: 10
    trigger:
      - platform: webhook
        webhook_id: 23359b06d16b5153bfe51873215b788cb9cb50b76ca5e3c8
        local_only: true
        allowed_methods: [POST]
    condition:
      # Ignore unexpected job names rather than failing on a templated
      # entity_id that doesn't resolve.
      - condition: template
        value_template: "{{ trigger.json.job in ['media', 'borg', 'flash', 'pool', 'zpool'] }}"
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: "input_datetime.backup_{{ trigger.json.job }}_last_seen"
        data:
          timestamp: "{{ now().timestamp() }}"

      - service: input_text.set_value
        target:
          entity_id: "input_text.backup_{{ trigger.json.job }}_status"
        data:
          value: "{{ trigger.json.status }}"

      - choose:
          - conditions: "{{ trigger.json.status == 'ok' }}"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: "input_datetime.backup_{{ trigger.json.job }}_last_ok"
                data:
                  timestamp: "{{ now().timestamp() }}"

          - conditions: "{{ trigger.json.status == 'fail' }}"
            sequence:
              - service: notify.mobile_app_eeros_iphone_17
                data:
                  title: "Backup failed: {{ trigger.json.job }}"
                  message: "{{ trigger.json.detail | default('no detail reported', true) }}"
                  data:
                    push:
                      interruption-level: time-sensitive
                    # Same tag replaces the previous alert instead of stacking
                    # three nights of identical failures on the lock screen.
                    tag: "backup-{{ trigger.json.job }}"
        # 'running' falls through deliberately: last_seen is already updated,
        # which is the entire purpose of that state.

  - id: backup_dead_man
    alias: Backup - dead-man switch
    description: >
      Notices silence, which is the failure mode a report-on-failure design
      cannot see: cron never fired, the VM is down, the script was deleted.
      A backup that stops reporting looks exactly like one that is fine.
    mode: single
    trigger:
      - platform: time_pattern
        hours: "/1"
    action:
      - repeat:
          for_each: ["media", "borg", "flash", "pool", "zpool"]
          sequence:
            - variables:
                seen_entity: "input_datetime.backup_{{ repeat.item }}_last_seen"
                ok_entity: "input_datetime.backup_{{ repeat.item }}_last_ok"
                # An input_datetime that has never been written reads as *today
                # 00:00*, not as unset — so a job that has never reported once
                # is not flagged immediately, but at 02:00 the next day when it
                # crosses 26 h. Acceptable: the jobs run 01:00–04:00, so a real
                # never-ran is caught within a day. float(0) is only a guard
                # against a genuinely missing attribute.
                seen_age: >
                  {{ (now().timestamp() - (state_attr(seen_entity, 'timestamp') | float(0))) / 3600 }}
                ok_age: >
                  {{ (now().timestamp() - (state_attr(ok_entity, 'timestamp') | float(0))) / 3600 }}
            - condition: template
              value_template: "{{ seen_age | float > 26 or ok_age | float > 168 }}"
            - service: notify.mobile_app_eeros_iphone_17
              data:
                title: "Backup silent: {{ repeat.item }}"
                message: >
                  {% if seen_age | float > 26 %}
                    No report in {{ seen_age | float | round(0) }} h — check cron, the VM, or the network.
                  {% else %}
                    Still reporting, but no successful run in {{ (ok_age | float / 24) | round(1) }} days.
                  {% endif %}
                data:
                  push:
                    interruption-level: time-sensitive
                  tag: "backup-silent-{{ repeat.item }}"

  - id: hetzner_capacity_report
    alias: Backup - Hetzner box capacity report
    description: >
      Daily fill level from the VM. Separate webhook from the job reports
      because the payload means something different — a measurement, not a
      run outcome — and mixing them would put a non-job through the
      last_seen/last_ok machinery.
    mode: queued
    max: 5
    trigger:
      - platform: webhook
        webhook_id: b0c29d7b2562debe49a4c281de74156e8b98e9ab683db38b
        local_only: true
        allowed_methods: [POST]
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.hetzner_box_used_percent
        data:
          value: "{{ trigger.json.used_percent | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.hetzner_box_used_tb
        data:
          value: "{{ trigger.json.used_tb | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.hetzner_borg_repo_gb
        data:
          value: "{{ trigger.json.borg_gb | float(0) }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hetzner_capacity_last_seen
        data:
          timestamp: "{{ now().timestamp() }}"

  - id: hetzner_capacity_warn
    alias: Backup - Hetzner box filling up
    description: >
      A full box does not degrade gracefully: borg and rsync simply start
      failing, so without this the first symptom would be a 4am failure alert.
      Crossing-based, so it fires on the way up rather than nagging; the daily
      recap carries the reminder from then on.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: input_number.hetzner_box_used_percent
        above: 85
        id: plan
      - platform: numeric_state
        entity_id: input_number.hetzner_box_used_percent
        above: 92
        id: act
    action:
      - service: notify.mobile_app_eeros_iphone_17
        data:
          title: >
            Hetzner box {{ states('input_number.hetzner_box_used_percent') }}% full
          message: >
            {% if trigger.id == 'act' %}
              Upgrade now — BX21 5 TB is nearly gone. BX31 (10 TB, ~€20.80) is
              an in-place upgrade, data preserved.
            {% else %}
              Time to plan the BX31 upgrade; still room, but the trend is one way.
            {% endif %}
          data:
            push:
              interruption-level: time-sensitive
            tag: hetzner-capacity

  - id: vm_disk_report
    alias: Backup - VM disk report
    description: >
      Daily root-filesystem reading from alpine-docker. Its own webhook: this
      is a measurement of the machine, not a backup run, so it has no business
      in the job report's last_seen/last_ok machinery.
    mode: queued
    max: 5
    trigger:
      - platform: webhook
        webhook_id: c784e4e3c3089a57900e3d915826e496dc1431d994a9cab8
        local_only: true
        allowed_methods: [POST]
    action:
      - service: input_number.set_value
        target: {entity_id: input_number.vm_disk_used_percent}
        data: {value: "{{ trigger.json.used_percent | float(0) }}"}
      - service: input_number.set_value
        target: {entity_id: input_number.vm_disk_free_gb}
        data: {value: "{{ trigger.json.free_gb | float(0) }}"}
      - service: input_datetime.set_datetime
        target: {entity_id: input_datetime.vm_disk_last_seen}
        data: {timestamp: "{{ now().timestamp() }}"}

  - id: vm_disk_warn
    alias: Backup - VM disk filling up
    description: >
      Thresholds are set low deliberately. Jellyfin needs 2 GiB free to start
      at all, and on a ~94 GB disk that is ~98%, so by the time "nearly full"
      looks alarming a service has already refused to boot. 80 gives room to
      investigate, 90 means act now.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: input_number.vm_disk_used_percent
        above: 80
        id: plan
      - platform: numeric_state
        entity_id: input_number.vm_disk_used_percent
        above: 90
        id: act
    action:
      - service: notify.mobile_app_eeros_iphone_17
        data:
          title: >
            VM disk {{ states('input_number.vm_disk_used_percent') }}% full
          message: >
            {{ states('input_number.vm_disk_free_gb') }} GB free.
            {% if trigger.id == 'act' %}
              Act now — services start failing near the top (Jellyfin needs 2 GiB
              free to boot). Check `docker system df`; build cache is the usual
              culprit.
            {% else %}
              Worth a look: `docker builder prune -af` reclaims the miniklubi
              build cache, which is what filled it in August 2026.
            {% endif %}
          data:
            push: {interruption-level: time-sensitive}
            tag: vm-disk

  - id: array_capacity_report
    alias: Backup - Unraid array capacity report
    description: >
      Daily array reading, taken from the VM's 9p view of /mnt/unraid rather
      than from Unraid itself, whose rootfs is tmpfs and would need the go file
      for cron.
    mode: queued
    max: 5
    trigger:
      - platform: webhook
        webhook_id: 4600bd0b290c716da32c31f2196303f757dca9cd55d801ef
        local_only: true
        allowed_methods: [POST]
    action:
      - service: input_number.set_value
        target: {entity_id: input_number.array_free_gb}
        data: {value: "{{ trigger.json.free_gb | float(0) }}"}
      - service: input_number.set_value
        target: {entity_id: input_number.array_used_percent}
        data: {value: "{{ trigger.json.used_percent | float(0) }}"}
      - service: input_datetime.set_datetime
        target: {entity_id: input_datetime.array_last_seen}
        data: {timestamp: "{{ now().timestamp() }}"}

  - id: array_capacity_warn
    alias: Backup - Unraid array filling up
    description: >
      Thresholds in GB, not percent. 400 GB is roughly five UHD remuxes of
      headroom — enough time to act. 150 GB means the next few downloads will
      not fit, and parity rebuilds want slack too. The array sat at 90% / 467 GB
      when this was written, so the first alert is genuinely imminent.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: input_number.array_free_gb
        below: 400
        id: plan
      - platform: numeric_state
        entity_id: input_number.array_free_gb
        below: 150
        id: act
    action:
      - service: notify.mobile_app_eeros_iphone_17
        data:
          title: >
            Array {{ states('input_number.array_free_gb') }} GB free ({{ states('input_number.array_used_percent') }}%)
          message: >
            {% if trigger.id == 'act' %}
              Nearly out — the next UHD download will not fit, and parity wants
              slack. The 3x4 TB drives are already here; this is the migration.
            {% else %}
              About five UHD remuxes of headroom left. Time to schedule the
              array swap rather than discover it mid-download.
            {% endif %}
          data:
            push: {interruption-level: time-sensitive}
            tag: array-capacity

  - id: container_updates_report
    alias: Backup - container image updates
    description: >
      Weekly skopeo check from the VM, moved off mail 2026-08-15 — mail left via
      the DMS container on the same VM being reported on. Silent when nothing
      needs updating, so it stays a signal; the full per-container report stays
      on the VM at /var/log/container-updates.log.
    mode: single
    trigger:
      - platform: webhook
        webhook_id: 18cf870fa4b27f7aaca249809eb5453082a294aa450bc892
        local_only: true
        allowed_methods: [POST]
    action:
      - service: input_number.set_value
        target: {entity_id: input_number.container_updates_count}
        data: {value: "{{ trigger.json.count | int(0) }}"}
      - condition: template
        value_template: "{{ (trigger.json.count | int(0)) > 0 }}"
      - service: notify.mobile_app_eeros_iphone_17
        data:
          title: >
            {{ trigger.json.count }} of {{ trigger.json.total }} containers have updates
          message: "{{ trigger.json.names }}"
          data:
            # Not urgent — updates can wait for a convenient evening, and
            # marking them time-sensitive would devalue the alerts that are.
            push: {interruption-level: passive}
            tag: container-updates

  - id: backup_daily_recap
    alias: Backup - daily recap of anything unhealthy
    description: >
      Safety net for a push that was missed, silenced or swiped away. A failing
      job keeps refreshing last_seen, so the dead-man switch never sees it and
      the only other signal is the nightly failure push. This asks a blunter
      question once a morning: has every job actually *succeeded* since
      yesterday? Silent when all three are healthy, so it stays a signal rather
      than furniture.
    mode: single
    trigger:
      - platform: time
        at: "09:00:00"
    action:
      - variables:
          problems: >
            {% set ns = namespace(p=[]) %}
            {% for j in ['media', 'borg', 'flash'] %}
              {% set ok = state_attr('input_datetime.backup_' ~ j ~ '_last_ok', 'timestamp') | float(0) %}
              {% set age = (now().timestamp() - ok) / 3600 %}
              {% if age > 26 %}
                {% set ns.p = ns.p + [ j ~ ' — ' ~ states('input_text.backup_' ~ j ~ '_status')
                                         ~ ', last good run ' ~ (age | round(0)) ~ ' h ago' ] %}
              {% endif %}
            {% endfor %}
            {# Capacity rides along: the crossing alert fires once, this keeps
               reminding until it is dealt with. #}
            {% set pct = states('input_number.hetzner_box_used_percent') | float(0) %}
            {% if pct >= 85 %}
              {% set ns.p = ns.p + [ 'Hetzner box ' ~ pct ~ '% full — upgrade to BX31' ] %}
            {% endif %}
            {% set cap_seen = state_attr('input_datetime.hetzner_capacity_last_seen', 'timestamp') | float(0) %}
            {% set cap_age = (now().timestamp() - cap_seen) / 3600 %}
            {% if cap_age > 26 %}
              {% set ns.p = ns.p + [ 'capacity check silent for ' ~ (cap_age | round(0)) ~ ' h' ] %}
            {% endif %}
            {# The VM's own disk rides along for the same reason as capacity:
               the crossing alert fires once, this keeps reminding. #}
            {% set vm_pct = states('input_number.vm_disk_used_percent') | float(0) %}
            {% if vm_pct >= 80 %}
              {% set ns.p = ns.p + [ 'VM disk ' ~ vm_pct ~ '% full, '
                                     ~ states('input_number.vm_disk_free_gb') ~ ' GB free' ] %}
            {% endif %}
            {% set arr_free = states('input_number.array_free_gb') | float(9999) %}
            {% if arr_free < 400 %}
              {% set ns.p = ns.p + [ 'array ' ~ arr_free ~ ' GB free ('
                                     ~ states('input_number.array_used_percent') ~ '%)' ] %}
            {% endif %}
            {% set arr_seen = state_attr('input_datetime.array_last_seen', 'timestamp') | float(0) %}
            {% set arr_age = (now().timestamp() - arr_seen) / 3600 %}
            {% if arr_age > 26 %}
              {% set ns.p = ns.p + [ 'array check silent for ' ~ (arr_age | round(0)) ~ ' h' ] %}
            {% endif %}
            {% set vm_seen = state_attr('input_datetime.vm_disk_last_seen', 'timestamp') | float(0) %}
            {% set vm_age = (now().timestamp() - vm_seen) / 3600 %}
            {% if vm_age > 26 %}
              {% set ns.p = ns.p + [ 'VM disk check silent for ' ~ (vm_age | round(0)) ~ ' h' ] %}
            {% endif %}
            {{ ns.p | join('; ') }}
      - condition: template
        value_template: "{{ problems | length > 0 }}"
      - service: notify.mobile_app_eeros_iphone_17
        data:
          title: Backups need attention
          message: "{{ problems }}"
          data:
            push:
              interruption-level: time-sensitive
            tag: backup-recap
