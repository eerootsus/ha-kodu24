# RECORD of the "Küte" view (path: heating) on the storage-mode `lovelace`
# dashboard. HA does not load this file; the live copy is in
# /config/.storage/lovelace.lovelace. Applied 2026-10-17 over the websocket API
# (lovelace/config/save), replacing only the view with path `heating`.
#
# Layout: rooms first for everyone - TRV-heated rooms, then "Muud ruumid"
# (living room, bathrooms, workshop), each card just temperature and humidity (TRV rooms: tap to change
# the target; icon colour = distance from target). Boiler in the column beside
# it. Targets, gaps, valves and trims live in the live Diagnostika table, next to
# the sensor-error graph; trends below. Sections grids are 12 columns PER span
# unit (a span-2 section is 24 wide), so 'full' is used for full-width cards.
#
# Why the room line does not show the thermostat's own "current temperature":
# that is the eTRV's internal sensor, which reads 1.5-3 C warm (see
# BETTER_THERMOSTAT.md). The room average from danfoss.py is what the trims aim
# at, so that is what the room cards show, coloured by distance from target:
# green within 0.5, light-blue/blue below, amber/deep-orange above.
#
# `heat_required` / hvac_action were dropped: they are "on"/"heating" whenever
# demand > 0, which on these valves is always.

title: Küte
path: heating
icon: mdi:radiator
type: sections
max_columns: 3
theme: Backend-selected
badges: []
cards: []
sections:
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Toad
    icon: mdi:home-thermometer
  - type: custom:mushroom-template-card
    entity: climate.trv_danfoss_kitchen
    primary: Köök
    secondary: '{{ states(''sensor.climate_kitchen_temperature'') }} °C · {{ states(''sensor.climate_kitchen_humidity'')
      | round(0) }} % niiskus'
    icon: mdi:radiator
    icon_color: '{% set room = states(''sensor.climate_kitchen_temperature'') | float(none) %}{% set sp
      = state_attr(''climate.trv_danfoss_kitchen'', ''temperature'') | float(none) %}{% if room is none
      or sp is none %}grey{% else %}{% set d = room - sp %}{% if d < -1.5 %}blue{% elif d < -0.5 %}light-blue{%
      elif d > 1.0 %}deep-orange{% elif d > 0.5 %}amber{% else %}green{% endif %}{% endif %}'
    multiline_secondary: true
    tap_action:
      action: more-info
    grid_options:
      columns: 8
  - type: custom:mushroom-template-card
    entity: climate.trv_danfoss_ada
    primary: Ada tuba
    secondary: '{{ states(''sensor.climate_ada_s_room_temperature'') }} °C · {{ states(''sensor.climate_ada_s_room_humidity'')
      | round(0) }} % niiskus'
    icon: mdi:radiator
    icon_color: '{% set room = states(''sensor.climate_ada_s_room_temperature'') | float(none) %}{% set
      sp = state_attr(''climate.trv_danfoss_ada'', ''temperature'') | float(none) %}{% if room is none
      or sp is none %}grey{% else %}{% set d = room - sp %}{% if d < -1.5 %}blue{% elif d < -0.5 %}light-blue{%
      elif d > 1.0 %}deep-orange{% elif d > 0.5 %}amber{% else %}green{% endif %}{% endif %}'
    multiline_secondary: true
    tap_action:
      action: more-info
    grid_options:
      columns: 8
  - type: custom:mushroom-template-card
    entity: climate.trv_danfoss_lola
    primary: Lola tuba
    secondary: '{{ states(''sensor.climate_lola_s_room_temperature'') }} °C · {{ states(''sensor.climate_lola_s_room_humidity'')
      | round(0) }} % niiskus'
    icon: mdi:radiator
    icon_color: '{% set room = states(''sensor.climate_lola_s_room_temperature'') | float(none) %}{% set
      sp = state_attr(''climate.trv_danfoss_lola'', ''temperature'') | float(none) %}{% if room is none
      or sp is none %}grey{% else %}{% set d = room - sp %}{% if d < -1.5 %}blue{% elif d < -0.5 %}light-blue{%
      elif d > 1.0 %}deep-orange{% elif d > 0.5 %}amber{% else %}green{% endif %}{% endif %}'
    multiline_secondary: true
    tap_action:
      action: more-info
    grid_options:
      columns: 8
  - type: custom:mushroom-template-card
    entity: climate.trv_danfoss_master
    primary: Kätlyni & Eero tuba
    secondary: '{{ states(''sensor.climate_bedroom_temperature'') }} °C · {{ states(''sensor.climate_bedroom_humidity'')
      | round(0) }} % niiskus'
    icon: mdi:radiator
    icon_color: '{% set room = states(''sensor.climate_bedroom_temperature'') | float(none) %}{% set sp
      = state_attr(''climate.trv_danfoss_master'', ''temperature'') | float(none) %}{% if room is none
      or sp is none %}grey{% else %}{% set d = room - sp %}{% if d < -1.5 %}blue{% elif d < -0.5 %}light-blue{%
      elif d > 1.0 %}deep-orange{% elif d > 0.5 %}amber{% else %}green{% endif %}{% endif %}'
    multiline_secondary: true
    tap_action:
      action: more-info
    grid_options:
      columns: 8
  - type: custom:mushroom-template-card
    entity: climate.trv_danfoss_stairwell
    primary: Trepihall
    secondary: '{{ state_attr(''climate.trv_danfoss_stairwell'', ''current_temperature'') }} °C'
    icon: mdi:radiator
    icon_color: grey
    multiline_secondary: true
    tap_action:
      action: more-info
    grid_options:
      columns: 8
  - type: heading
    heading: Muud ruumid
    icon: mdi:floor-plan
  - type: custom:mushroom-template-card
    primary: Elutuba
    icon: mdi:sofa
    secondary: '{{ states(''sensor.th_living_room_temperature'') }} °C · {{ states(''sensor.th_living_room_humidity'')
      | round(0) }} % niiskus'
    icon_color: grey
    entity: sensor.th_living_room_temperature
    tap_action:
      action: more-info
    grid_options:
      columns: 6
  - type: custom:mushroom-template-card
    primary: Alumine vannituba
    icon: mdi:shower
    secondary: '{{ states(''sensor.tz2000_a476raq2_ts0201_temperature'') }} °C · {{ states(''sensor.tz2000_a476raq2_ts0201_humidity'')
      | round(0) }} % niiskus'
    icon_color: grey
    entity: sensor.tz2000_a476raq2_ts0201_temperature
    tap_action:
      action: more-info
    grid_options:
      columns: 6
  - type: custom:mushroom-template-card
    primary: Ülemine vannituba
    icon: mdi:bathtub
    secondary: '{{ states(''sensor.th_upstairs_bathroom_temperature_2'') }} °C · {{ states(''sensor.th_upstairs_bathroom_humidity_2'')
      | round(0) }} % niiskus'
    icon_color: grey
    entity: sensor.th_upstairs_bathroom_temperature_2
    tap_action:
      action: more-info
    grid_options:
      columns: 6
  - type: custom:mushroom-template-card
    primary: Töökoda
    icon: mdi:hammer-wrench
    entity: climate.workshop_hvac
    secondary: '{{ states(''sensor.ikea_of_sweden_vindstyrka_temperature'') }} °C · {{ ''küte sees'' if
      is_state(''climate.workshop_hvac'', ''heat'') else ''küte väljas'' }}'
    icon_color: '{{ ''deep-orange'' if is_state(''climate.workshop_hvac'', ''heat'') else ''grey'' }}'
    tap_action:
      action: more-info
    grid_options:
      columns: 6
- type: grid
  cards:
  - type: heading
    heading: Gaasikatel
    icon: mdi:water-boiler
  - type: tile
    entity: sensor.vicare_outside_temperature
    name: Väljas (katla andur)
    grid_options:
      columns: 6
  - type: tile
    entity: weather.forecast_kodu
    name: Väljas (met.no)
    state_content:
    - temperature
    - state
    grid_options:
      columns: 6
  - type: tile
    entity: sensor.vicare_supply_temperature
    name: Pealevool
    grid_options:
      columns: 6
  - type: tile
    entity: binary_sensor.vicare_burner_active
    name: Põleti
    grid_options:
      columns: 6
  - type: tile
    entity: sensor.vicare_heating_gas_consumption_current_day
    name: Gaas täna
    grid_options:
      columns: 6
  - type: tile
    entity: sensor.vicare_heating_gas_consumption_last_seven_days
    name: Gaas 7 päeva
    grid_options:
      columns: 6
  - type: tile
    entity: number.vitodens_100_heating_curve_slope
    name: Küttekõver
    grid_options:
      columns: 6
  - type: tile
    entity: number.vitodens_100_heating_curve_shift
    name: Kõvera nihe
    grid_options:
      columns: 6
  - type: tile
    entity: climate.vicare_heating
    name: Režiim
    grid_options:
      columns: 6
  - type: tile
    entity: water_heater.vicare_water
    name: Tarbevesi
    grid_options:
      columns: 6
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Diagnostika
    icon: mdi:stethoscope
  - type: markdown
    content: "{% set rooms = [\n  ('Köök', 'kitchen', 'sensor.climate_kitchen_temperature'),\n  ('Ada',\
      \ 'ada', 'sensor.climate_ada_s_room_temperature'),\n  ('Lola', 'lola', 'sensor.climate_lola_s_room_temperature'),\n\
      \  ('Magamistuba', 'master', 'sensor.climate_bedroom_temperature'),\n  ('Trepihall', 'stairwell',\
      \ '')] %}\n{% macro n(v, f='%.1f') %}{{ f | format(v) if v is not none else '–' }}{% endmacro %}\n\
      | Ruum | Tuba | TRV | Siht | Tuba−siht | TRV−tuba | Trimm | Klapp |\n|:--|--:|--:|--:|--:|--:|--:|--:|\n\
      {%- for name, s, r in rooms %}\n{%- set c = 'climate.trv_danfoss_' ~ s %}\n{%- set room = (states(r)\
      \ | float(none)) if r else none %}\n{%- set trv = state_attr(c, 'current_temperature') | float(none)\
      \ %}\n{%- set sp = state_attr(c, 'temperature') | float(none) %}\n{%- set settled = states('sensor.trv_offset_'\
      \ ~ s ~ '_settled') | float(none) %}\n{%- set raw = (trv - room) if (trv is not none and room is\
      \ not none) else none %}\n| {{ name }} | {{ n(room) }} | {{ n(trv) }} | {{ n(sp) }} | {{ n((room\
      \ - sp) if (room is not none and sp is not none) else none, '%+.1f') }} | {{ n(settled, '%+.1f')\
      \ if settled is not none else ('~' ~ n(raw, '%+.1f') if raw is not none else '–') }} | {{ n(states('number.trv_danfoss_'\
      \ ~ s ~ '_regulation_setpoint_offset') | float(none), '%+.1f') }} | {{ states('sensor.trv_danfoss_'\
      \ ~ s ~ '_pi_heating_demand') }} % |\n{%- endfor %}\n\n**TRV−tuba** on TRV-anduri viga (ilma ~ märgita\
      \ = settled, muidu hetkeväärtus).\nTrimm peaks sellega ühtima, et tuba jõuaks sihini. Võrdlus nädalate\
      \ kaupa:\n`./heating-check.py`."
    grid_options:
      columns: full
- type: grid
  cards:
  - type: heading
    heading: TRV-anduri viga
    icon: mdi:thermometer-alert
  - type: statistics-graph
    title: Settled, 30 päeva
    chart_type: line
    period: hour
    days_to_show: 30
    stat_types:
    - mean
    entities:
    - entity: sensor.trv_offset_kitchen_settled
      name: Köök
    - entity: sensor.trv_offset_ada_settled
      name: Ada tuba
    - entity: sensor.trv_offset_lola_settled
      name: Lola tuba
    - entity: sensor.trv_offset_master_settled
      name: Kätlyni & Eero tuba
    grid_options:
      columns: full
      rows: 6
- type: grid
  column_span: 3
  cards:
  - type: heading
    heading: Trendid
    icon: mdi:chart-line
  - type: history-graph
    title: Toatemperatuurid, 48 h
    hours_to_show: 48
    entities:
    - entity: sensor.climate_kitchen_temperature
      name: Köök
    - entity: sensor.climate_ada_s_room_temperature
      name: Ada tuba
    - entity: sensor.climate_lola_s_room_temperature
      name: Lola tuba
    - entity: sensor.climate_bedroom_temperature
      name: Kätlyni & Eero tuba
    - entity: sensor.ikea_of_sweden_vindstyrka_temperature
      name: Töökoda
    grid_options:
      columns: 24
      rows: 6
  - type: statistics-graph
    title: Küttegaas päevas
    chart_type: bar
    period: day
    days_to_show: 30
    stat_types:
    - change
    entities:
    - entity: sensor.vicare_heating_gas_consumption_current_day
      name: Gaas
    grid_options:
      columns: 12
      rows: 6
