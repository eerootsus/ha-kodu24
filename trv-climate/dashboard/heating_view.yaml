# RECORD of the "Küte" view (path: heating) on the storage-mode `lovelace`
# dashboard. HA does not load this file; the live copy is in
# /config/.storage/lovelace.lovelace. Applied 2026-10-17 over the websocket API
# (lovelace/config/save), replacing only the view with path `heating`.
#
# Layout: rooms first for everyone - TRV-heated rooms, then "Muud ruumid"
# (living room, bathrooms, workshop), each card just temperature and humidity (TRV rooms: tap to change
# the room target, `input_number.room_target_<room>`; icon colour = distance from it).
# Since 2026-11-10 the HA room thermostat (room_thermostat.yaml) drives every TRV to
# 28 (open) / 5 (shut), so the cards and the Diagnostika table compare the room with
# the HA room target while it is on, and show HA's decision (avatud / kinni / TRV ise). Boiler in the column beside
# it. Targets, gaps, valves and trims live in the live Diagnostika table, next to
# the sensor-error graph; trends below. Sections grids are 12 columns PER span
# unit (a span-2 section is 24 wide), so 'full' is used for full-width cards.
#
# Why the room line does not show the thermostat's own "current temperature":
# that is the eTRV's internal sensor, which reads 1.5-3 C warm (see
# TRV_REGULATION.md). The room average from room_climate.py is what the trims aim
# at, so that is what the room cards show, coloured by distance from target:
# green within 0.5, light-blue/blue below, amber/deep-orange above.
#
# `heat_required` / hvac_action were dropped: they are "on"/"heating" whenever
# demand > 0, which on these valves is always.

title: Küte
path: heating
icon: mdi:radiator
type: sections
max_columns: 3
theme: Backend-selected
badges: []
cards: []
sections:
